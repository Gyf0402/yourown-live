name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。
            >
            > 🔄 **如何无损升级**：用户收藏、分组、设置与登录状态均保存在系统 `%APPDATA%\yourown-live\` 目录，直接覆盖安装新版 `Setup.exe` 或解压新版 `Portable.zip` 替换旧目录即可保留全部数据。

            ## ✨ v0.1.6 更新日志

            - **直连长播稳定性终极加固（彻底消除“偶发跳帧后显示自动续播”）**：
              - **修复 MSE 缓冲清理误切关键帧组（GOP）**：将 `autoCleanupMinBackwardDuration` 提升至 `60s`（`Max: 90s`），避免在 10~16 秒长 GOP 直播流上 `SourceBuffer.remove` 误删当前正在播放的关键帧组；显式关闭 `mpegts.js` 默认 `lazyLoad: false` 并修正 `stashInitialSize` 为 `128KB`
              - **修复跨空洞跳帧误落未缓冲间隙导致 `mpegts.js` 清空缓冲区**：所有追帧/救援跳转严格钳制在最后一段已缓冲区间 `[lastStart + 0.15, lastEnd - 0.25]` 内，普通单区间网络微停顿不再乱改 `currentTime`，彻底杜绝触发 `SeekingHandler` 误 flush 整个缓冲区引发自动续播
              - **平滑静默续播 & 防误判重连**：拆分 `directStreamSeq` 与 `directReloadTick`，消除续播时的二次播放器重建与全屏加载遮罩闪烁；窗口最小化/老板键隐藏/临时单屏放大期间暂停被隐藏分屏的卡顿判定；HLS 错误恢复计数在稳定播放 15 秒后自动回血；忽略平台 Cookie `overwrite` 瞬间删除，防止误触发全平台分屏重拉流
            - **高负载压力测试与并发卡死修复**：
              - **修复虎牙 Tars / B站 / 抖音二进制弹幕解包边界**：为 `tarsReadFields`、`parseProtoFields` 与 B站 `unpack` 增加严格的长度校验与循环上限保护，彻底修复遇到异常/复杂广播包时主进程死循环卡死的问题
              - **斗鱼签名极速化与高频切台防抖**：斗鱼抓流签名优先走 `node:vm` 0.3ms 极速沙箱（节省后台隐藏窗口 ~45MB 内存），分屏抓流加入 60ms 微防抖并在手动切画质/线路/刷新时自动清理待定重连定时器，开关弹幕不再重复回放历史缓存批次
              - **开发体验修复 & 更新器增强**：修复 Windows 含空格路径下 `pnpm dev` 启动失败问题（`scripts/dev.mjs`），更新器取消下载支持 0ms 瞬时中断解绑
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
