name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。
            >
            > 🔄 **如何无损升级**：用户收藏、分组、设置与登录状态均保存在系统 `%APPDATA%\yourown-live\` 目录，直接覆盖安装新版 `Setup.exe` 或解压新版 `Portable.zip` 替换旧目录即可保留全部数据。

            ## ✨ v0.1.4 更新日志

            - **直连播放稳定性大幅优化（彻底解决稳流反复跳帧/切线）**：
              - 关闭 `mpegts.js` 激进硬跳追帧（`liveBufferLatencyChasing`）并启用适度平滑缓冲，**流稳定播放且延迟 ≤ 8s 时保持 1.0× 原速绝不硬跳**；延迟缓慢累积（`> 8s`）时改用无感微加速（`1.05× / 1.1×`）平滑消化，仅极端积压（`> 18s`）时才跳回直播边缘
              - 修复卡顿救援逻辑在缓冲末尾误向后倒跳重播的问题；放宽微卡顿判定阈值（4.5s 仅在存在前方缓冲空洞时救援，连续完全冻结 12s 才触发重连），不再将短暂网络抖动误判为断流
              - 放宽 HLS 同步窗口（`liveSyncDurationCount: 3`、`liveMaxLatencyDurationCount: 10`），减少普通 HLS 直播切片拉扯
              - **稳定线路锁守**：当前线路连续稳定播放 ≥ 15 秒后自动记忆为稳定线路，CDN 周期性长连接 EOF 续播时优先沿用原线路续播，不再重新测速乱切其他线路；仅在真正报错/断流或手动刷新、换画质时重新择优
            - **文档与预览更新**：
              - 刷新 GitHub README `v0.1.3+` 实机预览截图与核心亮点说明
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
