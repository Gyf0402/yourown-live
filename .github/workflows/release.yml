name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。

            ## ✨ 核心特性

            - **四平台纯净直连无广告**：支持虎牙 / 斗鱼 / B站 / 抖音 FLV/HLS 低延迟直连，屏蔽贴片广告、礼物特效与后台 P2P 偷跑
            - **灵活多屏同看**：1×1 / 1×2 / 2×1 / 1+2 / 2×2 五种布局，支持拖拽调分屏比例、双击临时单屏放大、独立音量与一键独听
            - **原生高 DPI 弹幕**：直连四平台官方 WebSocket 弹幕，支持滚屏 / 迷你聊天流双模式、自定义区域与关键词/正则屏蔽
            - **近期优化**：
              - B站多线路并行测速择优、Chromium 会话 + WBI + AV1 编码支持（未登录部分房间直出 1080P 蓝光，扫码登录解锁 1080P 原画）
              - 斗鱼短号靓号与分享链接自动解析
              - 抖音未开播房间防跳转直播广场
              - 浅色 / 暗色观影 / 跟随系统主题、全局老板键（`Alt+X`）、系统托盘、收藏 JSON 导入导出与连接诊断面板

            Resolves #1
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
