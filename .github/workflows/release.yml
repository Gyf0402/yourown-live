name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。

            ## ✨ v0.1.1 更新日志

            - **修复斗鱼直连偶发 `ERR_FAILED (-2)`**：隐藏签名窗口改用独立 `partition` + `about:blank` 并接入 `node:vm` 毫秒级兜底（同步修复抖音弹幕签名同类隐患）
            - **新增斗鱼 / B站 SC（醒目留言）显示**：直连弹幕与迷你聊天流支持金色高亮显示 `[SC]`
            - **安装包无损瘦身**：排除已被 Vite 打包进前端产物的前端 `node_modules`，`app.asar` 缩减约 65 MB
            - **全栈交互与抓流细节修复**：
              - 修复弹幕屏蔽词输入框打 `f`/空格/方向键误触发全屏或暂停，以及弹窗内滚轮误调音量
              - 修复同一分屏切换主播后迷你聊天流与画布弹幕未清空的问题
              - 修复全局静音后点击单屏取消静音反而保持静音的问题
              - 修复抖音接口偶发 HTML 风控页导致的 JSON 解析异常，自动刷新 `ttwid` 重试
              - 修复虎牙 `fm` 参数双重解码边界异常、斗鱼/B站多域 Cookie 去重与空窗格斗鱼靓号解析
              - 包含 B站多线路并行测速、Chromium 会话 + WBI + AV1 1080P/原画解锁等全部特性
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
