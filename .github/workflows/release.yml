name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。

            ## ✨ v0.1.2 更新日志

            - **左侧主播列表自由拖拽排序 + 与开播优先解耦**：
              - 支持上下拖拽任意主播卡片自定义优先级顺序（同时保留拖拽卡片到右侧分屏播放），持久化保存
              - 新增「开播序 / 自定义」一键切换：开播序下同状态内按你的自定义顺序排，自定义模式下严格固定拖拽位置、互不冲突
            - **修复左侧主播列表多条目压缩问题**：补齐 `flex-shrink: 0` 与稳定滚动条布局，收藏再多主播也不会压扁卡片
            - **新增「极速直连拉流」加载动效**：平台主题色雷达波纹 + 旋转流光环 + 4 柱律动音轨波 + 底部扫光流束，完整适配浅色/暗色主题
            - **弹幕引擎 6 项深度修复**：
              - 修复切「滚屏/迷你聊天流」或开关弹幕后 Canvas 卡在 `300×150` 导致模糊/消失的问题，全屏与分屏缩放后立即重绘
              - 新增弹幕追尾碰撞预判算法，彻底解决长短弹幕中段重叠叠字
              - 优化高密度弹幕批处理队列防止 React 批处理丢消息
              - 修复迷你聊天流条目压扁与滚动异常、修复样式弹窗内滚轮误调音量
              - B 站弹幕鉴权改用完整 Chromium 会话 `liveSession.fetch`，与视频流共享全量登录凭证
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
