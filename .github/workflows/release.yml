name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。

            ## ✨ v0.1.3 更新日志

            - **全屏体验全面升级**：
              - 改用 Electron 原生窗口全屏，彻底修复 Windows 下点击全屏自动跳回的问题，且切画质 / 自动重连不会退出全屏，`Esc` / `F` / 双击画面可精准还原窗口尺寸
              - 新增**全屏鼠标静置 2.2 秒自动隐藏底部控制栏与鼠标指针**，轻移鼠标即唤出，悬停控制栏或暂停时不误隐藏
              - 为网页模式 `<webview>` 显式放行全屏权限
            - **四平台画质切换修复与完善**：
              - **斗鱼**：切换为完整 Chromium 会话 `liveSession.fetch` 携带全量登录 Cookie；未登录时 `原画2K60` 明确标示 `(需登录)` 并引导登录，若遇平台限制降级给出清晰提示不再静默弹回
              - **B站**：修复手动切低画质被多编码排序覆盖回退及误锁 `超清` 的 Bug；自动最高画质支持至 2K / 4K / 杜比
              - **虎牙 / 抖音**：实测各档位切换均正常生效，虎牙补全真实原画档位名
            - **分组管理全面进化（可删预置 + 自动识别 + 自定义修改）**：
              - **预置分组支持删除与重命名**：除「全部」外，`LOL`、`王者`、`户外`、`娱乐`、`综合` 及自定义分组均可点击 `×` 删除、**双击原地重命名**，并支持通过 `↺` 一键恢复已删预置标签
              - **自动识别匹配分区**：自动采集四平台实时分区（虎牙 / 斗鱼 / B站 / 抖音），添加主播默认「自动分组」智能匹配已有分组且绝不复活已删标签；手动指定或编辑修改后自动锁定不被覆盖，编辑行还提供 `✨ 识别分区` 一键归入按钮
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
