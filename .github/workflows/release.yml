name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。
            >
            > 🔄 **如何无损升级**：用户收藏、分组、设置与登录状态均保存在系统 `%APPDATA%\yourown-live\` 目录，直接覆盖安装新版 `Setup.exe` 或解压新版 `Portable.zip` 替换旧目录即可保留全部数据。

            ## ✨ v0.1.5 更新日志

            - **新增内置检查更新与应用内一键升级**：
              - **静默自动检测 + 手动检查**：客户端启动 5 秒后后台静默检查 GitHub Releases 最新版本（不弹窗打扰看播），发现新版本时在顶栏显示轻量「新版本」徽章；也可随时在「设置中心 → 检查更新」手动检测
              - **更新日志弹窗 & 一键下载安装**：内置浅色 / 暗色双主题毛玻璃更新弹窗，支持预览完整更新日志、应用内流式下载安装包（显示实时进度百分比与网速，支持随时取消并清理临时文件），下载完成后一键拉起安装向导自动无损覆盖升级（绿色便携版支持一键下载并定位文件夹）
              - **系统代理与容灾支持**：采用独立 Electron 网络会话（自动继承 Windows 系统代理），并在 GitHub API 匿名限流时自动切换备用检测通道；支持「忽略此版本」持久化记录与直接跳转 GitHub Release 页面兜底
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
