name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。
            >
            > 🔄 **如何无损升级**：用户收藏、分组、设置与登录状态均保存在系统 `%APPDATA%\yourown-live\` 目录，直接覆盖安装新版 `Setup.exe` 或解压新版 `Portable.zip` 替换旧目录即可保留全部数据。

            ## ✨ v0.1.10 更新日志

            - **网络带宽与电脑性能深度优化（无损体验）**：
              - **不可见且静音分屏 / 老板键隐藏智能断流休眠**：临时单屏放大、全屏遮挡或老板键隐藏时，静音的不可见分屏在 8 秒宽限后自动释放拉流与弹幕连接，恢复可见自动静默续播（未静音的后台听声不受任何影响）
              - **手动暂停自动省流 + 保留静帧**：暂停超 10 秒自动截图定格并断开后台拉流，画面不黑屏、带宽归零，继续播放自动追帧至最新画面
              - **B站批量查状态 & CDN 测速缓存**：多房间合并为单次批量接口，窗口隐藏或侧边栏折叠时暂停轮询；缓存胜出高速 CDN 节点 5 分钟减少重复首包浪费
              - **CPU / GPU / 内存全面减负**：弹幕 IPC 下沉消除高频 React 重渲染、Canvas 弹幕离屏位图缓存、不可见自动停 `rAF`；FLV 历史缓冲减半（四路省 200~450MB 内存）+ HLS 开启 Web Worker；主进程弹幕改异步解压并快速回收临时签名窗；隐藏态浮动控制栏关闭离屏毛玻璃模糊降低 GPU 合成负载
            - **直连模式直接发弹幕（B站免切网页）**：
              - 复用已登录 B站 Cookie 与 WBI 签名，在聊天流底栏直接输入发弹幕；滚屏/全屏模式点击发送按钮或按 `Enter` 呼出悬浮输入条即发即走，支持冷却防刷与屏蔽词/禁言提示
              - 其他平台提供一键「切网页发弹幕」快捷入口
            - **细节优化**：移除侧边栏拖拽排序后的常驻提示文字，界面更清爽
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
