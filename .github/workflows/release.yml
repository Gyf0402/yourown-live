name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Windows Release (NSIS + Portable ZIP)
        run: pnpm dist:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YourOwn Live ${{ github.ref_name }}
          body: |
            ## 📦 下载说明（Windows x64）

            - **`YourOwn-Live-*-win-x64-Setup.exe`**：Windows 安装版（可自定义安装目录、自动创建桌面快捷方式）
            - **`YourOwn-Live-*-win-x64-Portable.zip`**：Windows 绿色免安装版（解压后双击 `YourOwn Live.exe` 即可运行）

            > 💡 首次运行若弹出 Windows SmartScreen 未知发布者提示（开源软件未购买代码签名证书），点「更多信息 → 仍要运行」即可。
            >
            > 🔄 **如何无损升级**：用户收藏、分组、设置与登录状态均保存在系统 `%APPDATA%\yourown-live\` 目录，直接覆盖安装新版 `Setup.exe` 或解压新版 `Portable.zip` 替换旧目录即可保留全部数据。

            ## ✨ v0.1.7 更新日志

            - **全新「自由网页」：直播间之外，任意网站也能放进分屏一起刷**：
              - **任意网址即收藏**：左侧平台胶囊新增 `网页`（6 枚胶囊适配 292px 侧栏单行排布），默认分组新增 `网页`；粘贴 `www.douyin.com`、`www.bilibili.com`、`xiaohongshu.com`、`weibo.com` 等任意网址（含裸域名、`b23.tv` / `v.douyin.com` 短链）自动识别为自由网页收藏并归入「网页」分组，而 `live.bilibili.com/房间号`、`live.douyin.com/房间号` 与虎牙 / 斗鱼链接依然走纯净直连直播，两类收藏互不干扰
              - **网页收藏不参与开播检测**：跳过测开播轮询、不显示「未开播」灰态，支持备注、置顶、拖拽排序、拖进任意分屏与 JSON 导入导出备份；空窗格新增「边看边刷」抖音 / B站 / 小红书 / 微博一键入口，免收藏直接开刷
              - **登录态与站内功能完整保留**：自由网页窗格共享 `partition="persist:livehub"`，直接复用应用内已登录的 B站 / 抖音 / 虎牙 / 斗鱼 Cookie（未登录时点「登录同步」完成登录后窗格自动刷新生效），且不加载直播净化脚本，完整保留推荐流、评论区、搜索与点赞
            - **网页窗格内置迷你浏览器顶栏**：
              - **固定悬浮不遮挡站点搜索栏**：集成拖拽互换、后退 / 前进 / 刷新、可编辑地址栏（输入网址或关键词直接搜索跳转）、转系统浏览器打开，并保留独听 / 静音 / 临时放大 / 切主屏 / 关闭，联动全局静音与老板键（`Alt+X`）
              - **宽度自适应缩放**：监听窗格宽度变化（拖分割线、临时单屏放大时同步生效），桌面排版在窄分屏自动按比例缩放（65%–100%），避免 B站 / 抖音横向裁切；也支持 `-` / `+` 手动 50%–150% 微调与「适配 / 100%」一键切换
              - **桌面版 / 手机版一键切换**：窄分屏刷 B站、微博、知乎等站点时切到手机排版，并保留当前浏览网址；B站视频卡片等 `target="_blank"` 链接在当前窗格内直接跳转，第三方微信 / QQ 授权弹窗继续共享同一 Cookie 分区
              - **窄窗格 UI 适配与浅 / 暗双主题**：窗格 `< 680px` / `< 520px` 时自动精简文字标签与次要按钮，地址栏在 1×2、1+2、2×2 分屏下不换行不拥挤；注入细滚动条与顶部进度条，并提供加载失败兜底（重新加载 / 浏览器打开）
            - **文档更新**：README 核心亮点新增「自由网页」章节并同步更新简介与下载说明
          files: |
            release/YourOwn-Live-*-win-x64-Setup.exe
            release/YourOwn-Live-*-win-x64-Portable.zip
